  --abnb:#C4483A; --abnbWash:#FBF0EE; --bkg:#2C558F; --bkgWash:#EDF1F8; --direct:#B8881A; --directWash:#FBF3E2;
  --wa:#2F7D5C; --waWash:#EDF5F1; --ota:#6A6155;
  --open:#B8881A; --unassigned:#C4483A; --done:#9B9285;
  --sans:'Geist',-apple-system,system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --col:78px; --listw:236px; --rowh:74px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#DEDAD0;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.025em;line-height:1.1;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono)}
.sheet{background:var(--cream);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 44px rgba(22,19,14,.10)}
.wrap{max-width:1440px;margin:0 auto;padding:36px 28px 80px}
.seclabel{display:flex;align-items:baseline;gap:12px;margin:44px 0 14px}
.seclabel .n{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--goldDeep)}
.seclabel h2{font-size:19px}
.seclabel .d{font-size:13px;color:var(--ink2);margin-left:auto;text-align:right;max-width:460px;line-height:1.45}
a{color:var(--goldDeep);text-decoration:none}
a:hover{color:var(--ink)}
</style>
