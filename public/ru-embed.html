<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rental United Channel Manager</title>
    <!--
      Served without CSP (see vite.config) so RU white-label can set <base> and load pms-dist.
      Parent orchestrator CSP is NOT inherited on a navigated iframe document.
    -->
    <base href="https://new.rentalsunited.com/" />
    <script>
      /**
       * ⚠️ CRITICAL — ne pas retirer. Doit s'exécuter AVANT tout script RU.
       *
       * Le <base> ci-dessus est indispensable (les scripts pms-dist de RU sont
       * résolus relativement à lui), mais il fait croire au routeur Angular de
       * RU que l'URL courante est https://new.rentalsunited.com/… Il appelle
       * alors history.replaceState() avec cette URL depuis un document servi
       * par notre origine → le navigateur lève :
       *   SecurityError: Failed to execute 'replaceState' on 'History'
       * Angular remonte l'erreur à son ErrorHandler → showError() → « OOOPS ».
       *
       * Le widget n'a AUCUN besoin de manipuler l'historique : il vit dans une
       * iframe sans navigation propre. On neutralise donc push/replaceState en
       * no-op tolérant. Sans ça, le widget casse de façon intermittente selon
       * la route interne empruntée (d'où « ça marche puis ça s'arrête »).
       */
      (function () {
        var noop = function () {
          /* iframe embarquée : pas d'historique à manipuler */
        };
        try {
          history.pushState = noop;
          history.replaceState = noop;
        } catch (e) {
          /* certains navigateurs figent History.prototype — on ignore */
        }
      })();
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
      integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
      integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css"
    />
    <script
      src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
      integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
      crossorigin="anonymous"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
      }
      body {
        /* Aucun padding : le cadre est déjà dessiné par le conteneur React.
           Un padding ici créait une seconde barre de défilement imbriquée. */
        padding: 0;
      }
      #ruApp {
        width: 100%;
        height: 100%;
        overflow: auto;
        /* Ascenseur discret — le widget RU est dense */
        scrollbar-width: thin;
        /* Masqué tant que la grille des canaux n'est pas complète : évite de
           voir apparaître la barre de recherche seule, puis le contenu. */
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #ruApp.ru-ready {
        opacity: 1;
      }
      #ruApp .connected-channels-container {
        box-shadow: none !important;
        -webkit-box-shadow: none !important;
        -moz-box-shadow: none !important;
      }
      /* Barre de recherche RU masquée : sans usage (les canaux tiennent à
         l'écran) et elle coûtait 92 px de hauteur en haut du widget. */
      #ruApp .connected-channels-container > .header {
        display: none !important;
      }
      #ruApp * {
        box-sizing: border-box;
      }
      #ru-embed-status {
        font: 12px/1.4 system-ui, sans-serif;
        color: #666;
        padding: 8px;
      }
      /* Écran d'attente : les bundles RU pèsent ~3,8 Mo et peuvent être lents
         à arriver selon la liaison. Sans retour visuel, l'écran blanc laisse
         croire à une panne (incident 2026-07-28). */
      .ru-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 420px;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        color: #374151;
      }
      .ru-boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid #e5e7eb;
        border-top-color: #c8a24a;
        border-radius: 50%;
        animation: ru-spin 0.9s linear infinite;
      }
      @keyframes ru-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .ru-boot-title {
        font-weight: 600;
        color: #111827;
      }
      .ru-boot-step {
        font-size: 12.5px;
        color: #6b7280;
      }
      .ru-boot-bar {
        width: min(320px, 70%);
        height: 4px;
        background: #eef0f3;
        border-radius: 999px;
        overflow: hidden;
      }
      .ru-boot-bar-fill {
        height: 100%;
        width: 0;
        background: #c8a24a;
        border-radius: 999px;
        transition: width 0.4s ease;
      }
      .ru-boot-hint {
        font-size: 12px;
        color: #9ca3af;
        text-align: center;
        max-width: 380px;
        min-height: 16px;
      }
      .ru-boot-error {
        color: #b91c1c;
      }
      .ru-boot-retry {
        margin-top: 4px;
        padding: 7px 14px;
        font: 13px system-ui, sans-serif;
        color: #fff;
        background: #c8a24a;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="ru-embed-status">
      <div class="ru-boot">
        <div class="ru-boot-spinner"></div>
        <div class="ru-boot-title">Connexion à votre Channel Manager…</div>
        <div class="ru-boot-step" id="ru-boot-step">Préparation</div>
        <div class="ru-boot-bar"><div class="ru-boot-bar-fill" id="ru-boot-fill"></div></div>
        <div class="ru-boot-hint" id="ru-boot-hint"></div>
      </div>
    </div>
    <div id="ruApp"></div>
    <script>
      /**
       * ⚠️ CRITICAL — cache des bundles RU (incident 2026-07-28).
       *
       * RU sert vendor.js (2 Mo) + main.js (1,8 Mo) avec `cache-control:
       * no-store` : le navigateur les retélécharge à CHAQUE ouverture. Sur une
       * liaison lente vers RU (22 Ko/s mesurés depuis le Maroc, contre
       * 4 500 Ko/s depuis GKE Paris — routage opérateur), cela fait ~60 s
       * d'écran blanc à chaque fois.
       *
       * On réécrit donc les URLs pms-dist vers /ru-assets/* (proxy avec cache
       * disque, cf. security/ruAssetCache.ts). Premier chargement identique,
       * puis quasi instantané. Uniquement en dev : en production le front est
       * servi par Vercel, où ce middleware n'existe pas — d'où le test
       * d'origine locale ci-dessous.
       */
      (function () {
        var h = location.hostname;
        var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
        if (!isLocal) return;
        // pms-dist couvre JS *et* CSS : styles.css mesuré à 5 142 ms sans cache.
        var PMS = /^https:\/\/new\.rentalsunited\.com\/app\/pms-dist\/(.+)$/i;
        var rewrite = function (v) {
          var m = PMS.exec(String(v));
          // URL absolue obligatoire : le <base> RU réécrirait un chemin relatif
          // vers new.rentalsunited.com et le cache serait contourné.
          return m ? location.origin + '/ru-assets/' + m[1] : v;
        };
        try {
          // 1) propriété .src sur le prototype (couvre el.src = '...')
          var d = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
          Object.defineProperty(HTMLScriptElement.prototype, 'src', {
            configurable: true,
            enumerable: d.enumerable,
            get: function () {
              return d.get.call(this);
            },
            set: function (v) {
              d.set.call(this, rewrite(v));
            },
          });
          // 2) href des <link rel=stylesheet> — styles.css pèse lourd et était
          //    mesuré à 5 142 ms sans cache (il n'a pas de .src, d'où cet ajout)
          var dh = Object.getOwnPropertyDescriptor(HTMLLinkElement.prototype, 'href');
          Object.defineProperty(HTMLLinkElement.prototype, 'href', {
            configurable: true,
            enumerable: dh.enumerable,
            get: function () {
              return dh.get.call(this);
            },
            set: function (v) {
              dh.set.call(this, rewrite(v));
            },
          });
          // 3) setAttribute('src'|'href', …) — chemin emprunté par jQuery
          var origSetAttr = Element.prototype.setAttribute;
          Element.prototype.setAttribute = function (name, value) {
            var n = String(name).toLowerCase();
            var isAsset =
              (this.tagName === 'SCRIPT' && n === 'src') ||
              (this.tagName === 'LINK' && n === 'href');
            if (isAsset) return origSetAttr.call(this, name, rewrite(value));
            return origSetAttr.call(this, name, value);
          };
          // 3) jQuery._evalUrl passe par $.ajax : on réécrit aussi les XHR
          var origOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url) {
            var args = [].slice.call(arguments);
            args[1] = rewrite(url);
            return origOpen.apply(this, args);
          };
        } catch (e) {
          /* si l'interception échoue, on retombe sur le chargement direct */
        }

        /**
         * Préchargement parallèle des bundles pms-dist.
         *
         * Le script client RU (qui porte le token) met ~550 ms, et ce n'est
         * qu'ENSUITE qu'il injecte les bundles. Ces 550 ms étaient du temps mort.
         * On lance donc le préchargement immédiatement : quand RU les demande,
         * ils sont déjà dans le cache HTTP du navigateur.
         *
         * Sans risque : mêmes URLs que celles que RU demandera (donc réutilisées,
         * pas retéléchargées), et servies par notre proxy local.
         */
        try {
          var ASSETS = [
            'runtime.js',
            'polyfills.js',
            'vendor.js',
            'scripts.js',
            'main.js',
            'styles.css',
          ];
          ASSETS.forEach(function (name) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = name.slice(-4) === '.css' ? 'style' : 'script';
            // setAttribute direct : contourne notre propre réécriture de href
            // (l'URL est déjà celle du proxy).
            l.setAttribute('href', location.origin + '/ru-assets/' + name + '?v=1.0.0.0');
            document.head.appendChild(l);
          });
        } catch (e) {
          /* préchargement best-effort : un échec ne doit rien casser */
        }

        /**
         * Filet : Angular insère styles.css par un chemin qui échappe aux
         * interceptions ci-dessus (mesuré à 6 704 ms en direct depuis RU).
         * On surveille donc le <head> et on réécrit tout lien pms-dist qui
         * apparaît, avant que le navigateur ne le télécharge.
         */
        try {
          new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
              var nodes = muts[i].addedNodes;
              for (var j = 0; j < nodes.length; j++) {
                var n = nodes[j];
                if (!n || n.tagName !== 'LINK') continue;
                var href = n.getAttribute('href') || '';
                var fixed = rewrite(href);
                if (fixed !== href) n.setAttribute('href', fixed);
              }
            }
          }).observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {
          /* best-effort */
        }
      })();
    </script>
    <script>
      /**
       * Séquencement du démarrage RU + retour visuel.
       *
       * Le widget passe par 3 étapes invisibles pour l'utilisateur :
       *   1. chargement du script client RU (léger, porte le token)
       *   2. injection + téléchargement des bundles pms-dist (~3,8 Mo)
       *   3. bootstrap Angular, puis PREMIER RENDU dans #ruApp
       *
       * L'ancien code affichait « conteneur vide » après un setTimeout fixe de
       * 4 s : sur liaison lente c'était un faux négatif systématique, et rien
       * n'indiquait la progression (écran blanc → panne supposée).
       *
       * Ici on observe le DOM : on masque l'écran d'attente au moment exact où
       * RU a réellement peint son contenu, jamais sur un délai deviné.
       */
      (function () {
        var t0 = Date.now();
        var params = new URLSearchParams(window.location.search);
        var scriptUrl = params.get('script');
        var statusEl = document.getElementById('ru-embed-status');
        var stepEl = document.getElementById('ru-boot-step');
        var fillEl = document.getElementById('ru-boot-fill');
        var hintEl = document.getElementById('ru-boot-hint');
        var app = document.getElementById('ruApp');
        var done = false;

        function ms() {
          return ((Date.now() - t0) / 1000).toFixed(1) + 's';
        }
        function log(msg, extra) {
          console.info('[ru-embed ' + ms() + '] ' + msg, extra === undefined ? '' : extra);
        }
        function step(label, pct) {
          if (stepEl) stepEl.textContent = label;
          if (fillEl && pct != null) fillEl.style.width = pct + '%';
          log('étape → ' + label + (pct != null ? ' (' + pct + '%)' : ''));
        }
        function fail(msg, detail) {
          if (done) return;
          done = true;
          console.error('[ru-embed ' + ms() + '] ÉCHEC: ' + msg, detail || '');
          if (!statusEl) return;
          statusEl.innerHTML = '';
          var box = document.createElement('div');
          box.className = 'ru-boot';
          var t = document.createElement('div');
          t.className = 'ru-boot-title ru-boot-error';
          t.textContent = 'Channel Manager indisponible';
          var h = document.createElement('div');
          h.className = 'ru-boot-hint';
          h.textContent = msg;
          var b = document.createElement('button');
          b.className = 'ru-boot-retry';
          b.textContent = 'Réessayer';
          b.onclick = function () {
            location.reload();
          };
          box.appendChild(t);
          box.appendChild(h);
          box.appendChild(b);
          statusEl.appendChild(box);
        }
        function succeed(childCount) {
          if (done) return;
          done = true;
          var secs = (Date.now() - t0) / 1000;
          log('✅ widget rendu — ' + childCount + ' élément(s) dans #ruApp');
          console.info(
            '[ru-embed] prêt en ' + secs.toFixed(1) + 's' +
              (secs > 15 ? ' — liaison lente vers Rental United' : ''),
          );
          if (statusEl) statusEl.style.display = 'none';
          if (app) app.classList.add('ru-ready');
        }

        if (!scriptUrl) return fail('Adresse du widget manquante.');
        // Allowlist stricte : uniquement les hôtes RU.
        if (!/^https:\/\/([a-z0-9-]+\.)*rentalsunited\.com\//i.test(scriptUrl)) {
          return fail('Adresse du widget non autorisée.');
        }

        step('Connexion au Channel Manager', 10);

        // Message rassurant si l'attente se prolonge (liaison lente ≠ panne).
        var hintTimer = setTimeout(function () {
          if (!done && hintEl) {
            hintEl.textContent =
              'Le chargement est plus long que d’habitude — le Channel Manager envoie environ 4 Mo de données.';
          }
        }, 12000);

        /**
         * Détection du rendu réel.
         *
         * Angular peint en deux temps : d'abord la coquille (barre de
         * recherche, titres), puis la grille des canaux quand les données
         * arrivent. Démasquer dès la coquille donnait un affichage « en deux
         * étapes » disgracieux — on attend donc que les VIGNETTES DE CANAUX
         * soient présentes, puis qu'elles se stabilisent (2 relevés
         * identiques), pour révéler l'ensemble d'un seul coup.
         */
        var lastCount = -1;
        var stableTicks = 0;
        var settleTimer = null;

        function checkPainted() {
          if (done || !app) return;
          var shell = app.querySelector('app-white-pms-page, [class*="container"]');
          if (!shell) return;
          var logos = app.querySelectorAll('img').length;
          if (logos === 0) {
            step('Récupération de vos canaux', 75);
            return;
          }
          step('Affichage de vos canaux', 92);
          // Stabilisation : 2 relevés consécutifs au même compte = rendu fini.
          if (logos === lastCount) {
            stableTicks += 1;
          } else {
            stableTicks = 0;
            lastCount = logos;
          }
          if (stableTicks >= 2) {
            clearTimeout(hintTimer);
            if (settleTimer) clearInterval(settleTimer);
            observer.disconnect();
            log('grille stabilisée — ' + logos + ' canaux');
            succeed(app.childElementCount);
          }
        }

        // Le MutationObserver capte l'arrivée du contenu ; l'intervalle assure
        // la stabilisation même quand RU cesse de muter le DOM.
        settleTimer = setInterval(checkPainted, 250);
        var observer = new MutationObserver(checkPainted);
        if (app) observer.observe(app, { childList: true, subtree: true });

        // Filet de sécurité : 4 min couvrent le pire cas mesuré (~98 s) avec
        // une marge large, sans jamais afficher un faux échec.
        var hardTimeout = setTimeout(function () {
          if (done) return;
          observer.disconnect();
          var n = app ? app.childElementCount : 0;
          if (n > 0) return succeed(n); // rendu partiel : on affiche quand même
          fail(
            'Le Channel Manager n’a pas répondu à temps. Vérifiez votre connexion, puis réessayez.',
          );
        }, 240000);

        var s = document.createElement('script');
        s.src = scriptUrl;
        s.async = false;
        s.onload = function () {
          step('Chargement de l’interface', 45);
          log('script client RU chargé — bundles pms-dist en cours');
        };
        s.onerror = function () {
          clearTimeout(hintTimer);
          clearTimeout(hardTimeout);
          observer.disconnect();
          fail('Impossible de joindre Rental United. Vérifiez votre connexion.');
        };
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
